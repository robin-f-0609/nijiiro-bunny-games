<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf5e9"><meta name="description" content="ふじたと一緒に、旅の本をつくろう。読む、選ぶ、ときどき手伝う、参加型デジタル絵本。">
<title>ふじた地球旅行記 ― さいごの、しろいページ</title>
<link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script>
</head>
<body>
<div class="reader" id="reader">
<header class="toolbar"><a class="brand" href="../" aria-label="おはなしの ほんだなへ">ふじた地球旅行記<span>さいごの、しろいページ</span></a><div class="tools"><button id="sound" class="tool" aria-pressed="false">音 なし</button><button id="settings" class="tool" aria-haspopup="dialog">設定</button></div></header>
<main id="reading" tabindex="-1" aria-label="おはなし"><div class="chapter-line"><span id="chapter"></span><span id="meter-slot"></span></div><article id="page" aria-label="おはなしのページ" tabindex="0"></article></main>
<footer class="navigation"><button id="back" class="back">‹ もどる</button><span id="page-number" aria-label="現在のページ"></span><button id="next" class="next">つぎへ ›</button></footer><div class="progress" aria-hidden="true"><span id="progress"></span></div>
</div>
<dialog id="preferences" aria-labelledby="preferences-title"><form method="dialog"><h2 id="preferences-title">読みかた</h2><label><input type="checkbox" id="instant"> 文章を一度に表示する</label><label><input type="checkbox" id="large"> 文字を大きくする</label><p>音がなくても、最後まで遊べます。<br>続きは、このブラウザに保存されます。</p><button class="next" value="close">とじる</button></form></dialog>
<noscript><p class="noscript">この絵本を遊ぶには、ブラウザのJavaScriptを有効にしてください。</p></noscript>
</body></html>
