name: Interactive picture book checks
on:
  push:
    paths: ['fujita-earth-trip/**', 'preview/**', 'tests/**', 'package.json', '.github/workflows/reader.yml']
  pull_request:
    paths: ['fujita-earth-trip/**', 'tests/**', 'package.json', '.github/workflows/reader.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run test:dom
      - run: npx playwright install --with-deps chromium
      - name: Check six paths and accessible alternatives
        run: |
          python3 -m http.server 4173 > /tmp/fujita-http.log 2>&1 &
          npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-checks
          path: /tmp/fujita-test/
